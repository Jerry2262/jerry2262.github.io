<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="一个在浏览器端输入密码并解密内容的静态页面演示。"
    />
    <title>秘密 | Jerry</title>
    <link rel="stylesheet" href="style.css" />
    <script src="payload.js" defer></script>
    <script src="secret-loader.js" defer></script>
  </head>
  <body>
    <header class="app-header" aria-label="秘密应用导航">
      <a class="home-link" href="../../index.html" aria-label="返回主页">
        <span aria-hidden="true">‹</span>
        <span>主页</span>
      </a>
      <div class="status-row" aria-label="加密状态">
        <div class="status-box">
          <span>加密方式</span>
          <strong>AES-GCM</strong>
        </div>
        <div class="status-box">
          <span>状态</span>
          <strong id="secretState">待解锁</strong>
        </div>
      </div>
    </header>

    <main class="secret-shell">
      <section class="unlock-panel" aria-labelledby="secret-title">
        <p class="eyebrow">Encrypted Page</p>
        <h1 id="secret-title">秘密</h1>
        <p class="intro">
          输入正确密码后，浏览器会把仓库中的密文解密为完整
          HTML，并用解密结果替换当前页面。
        </p>

        <form id="unlock-form" class="unlock-form">
          <label for="secret-password">密码</label>
          <div class="password-row">
            <input
              id="secret-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
            <button class="solid-button" id="unlock-button" type="submit">
              解锁页面
            </button>
          </div>
          <p
            id="unlock-status"
            class="status"
            role="alert"
            aria-live="polite"
          ></p>
        </form>
      </section>

      <aside class="cipher-panel" aria-label="密文状态">
        <span class="cipher-index">Encrypted Content</span>
        <h2>内容尚未解锁</h2>
        <p>正确密码通过认证后，密文才会在当前浏览器中解密并显示。</p>
      </aside>
    </main>
  </body>
</html>
